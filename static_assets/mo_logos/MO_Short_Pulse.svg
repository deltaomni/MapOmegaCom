	<g transform='translate(0 0) rotate(0,24,24)'>
		<style type="text/css">
			.circleslctd {
			fill: transparent;
			stroke: blue;
			stroke-width: 5;
			}

			.pulseselctd {
			-webkit-transform-origin: 50% 50%;
			transform-origin: 50% 50%;
			-webkit-animation-duration: 2s;
			animation-duration: 2s;
			-webkit-animation-name: pulseselctd;
			animation-name: pulseselctd;
			-webkit-animation-iteration-count: infinite;
			animation-iteration-count: infinite;
			}

			@-webkit-keyframes pulseselctd {
			from {
			stroke-width: 10px;
			stroke-opacity: 1;
			-webkit-transform: scale(0.3);
			transform: scale(0.3);
			}

			to {
			stroke-width: 0;
			stroke-opacity: 0;
			-webkit-transform: scale(2.3);
			transform: scale(2.3);
			}
			}

			@keyframes pulseselctd {
			from {
			stroke-width: 15px;
			stroke-opacity: 1;
			-webkit-transform: scale(0.3);
			transform: scale(0.3);
			}

			to {
			stroke-width: 0;
			stroke-opacity: 0;
			-webkit-transform: scale(2.3);
			transform: scale(2.3);
			}
			}
		</style>
		<circle class='pulseselctd circleslctd' cx='50%' cy='50%' r='10px'>
		</circle>
	</g>

